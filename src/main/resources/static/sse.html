<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SSE 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .controls { margin-bottom: 20px; padding: 15px; background-color: #f5f5f5; border-radius: 5px; }
        .log-container { height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background-color: #fafafa; }
        button { margin: 5px; padding: 8px 15px; cursor: pointer; }
        .connect { background-color: #4CAF50; color: white; border: none; border-radius: 3px; }
        .disconnect { background-color: #f44336; color: white; border: none; border-radius: 3px; }
        .clear { background-color: #008CBA; color: white; border: none; border-radius: 3px; }
        .status { margin: 10px 0; font-weight: bold; }
        .connected { color: green; }
        .disconnected { color: red; }
        .data-item { margin: 5px 0; padding: 5px; border-left: 3px solid #ddd; }
        .initial-data { border-left-color: #4CAF50; background-color: #f0f8f0; }
        .hourly-update { border-left-color: #2196F3; background-color: #f0f4f8; }
        .error { border-left-color: #f44336; background-color: #fdf0f0; color: red; }
    </style>
</head>
<body>
<div class="container">
    <h1>SSE 실시간 데이터 테스트</h1>

    <div class="controls">
        <h3>연결 설정</h3>
        <button class="connect" onclick="connectLTE()">LTE 데이터 구독 (001)</button>
        <button class="connect" onclick="connect5G()">5G 데이터 구독 (002)</button>
        <button class="disconnect" onclick="disconnect()">연결 끊기</button>
        <button class="clear" onclick="clearLog()">로그 지우기</button>

        <div class="status" id="status">연결 상태: <span class="disconnected">끊어짐</span></div>
        <div>현재 구독: <span id="currentSubscription">없음</span></div>
    </div>

    <div class="log-container" id="log">
        <p>위 버튼을 클릭하여 SSE 연결을 시작하세요.</p>
    </div>
</div>

<script>
    let eventSource = null;
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const currentSubscription = document.getElementById('currentSubscription');

    function addLog(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const logClass = type === 'error' ? 'error' :
            type === 'initial' ? 'initial-data' :
                type === 'update' ? 'hourly-update' : '';

        log.innerHTML += `<div class="data-item ${logClass}">
            <strong>[${timestamp}]</strong> ${message}
        </div>`;
        log.scrollTop = log.scrollHeight;
    }

    function updateStatus(connected, subscription = '') {
        if (connected) {
            status.innerHTML = '연결 상태: <span class="connected">연결됨</span>';
            currentSubscription.textContent = subscription;
        } else {
            status.innerHTML = '연결 상태: <span class="disconnected">끊어짐</span>';
            currentSubscription.textContent = '없음';
        }
    }

    function connectLTE() {
        disconnect();
        eventSource = new EventSource("http://localhost:8080/api/data/current-prices/stream/001");
        setupEventListeners('LTE (001)', '001');
        addLog('🔗 LTE 데이터 스트림에 연결 시도 중...', 'info');
    }

    function connect5G() {
        disconnect();
        eventSource = new EventSource("http://localhost:8080/api/data/current-prices/stream/002");
        setupEventListeners('5G (002)', '002');
        addLog('🔗 5G 데이터 스트림에 연결 시도 중...', 'info');
    }

    function setupEventListeners(subscriptionType, dataCode) {
        eventSource.onopen = () => {
            updateStatus(true, subscriptionType);
            addLog(`✅ ${subscriptionType} 연결 성공!`, 'info');
        };

        eventSource.addEventListener("initial-data", (event) => {
            const data = JSON.parse(event.data);
            addLog(`📦 초기 데이터 수신 (${data.length}개):`, 'initial');
            const allData = data.map(item =>
                `시간: ${item.aggregatedAt}, 가격: ${item.avgPrice}원, 코드: ${item.dataCode}`
            ).join('<br>');
            addLog(allData, 'initial');
        });

        // ✅ dataCode 기반의 hourly 이벤트 등록
        const hourlyEventName = `${dataCode}-hourly-update`;
        eventSource.addEventListener(hourlyEventName, (event) => {
            const data = JSON.parse(event.data);
            addLog(`📈 [${dataCode}] 실시간 업데이트 수신 (${data.length}개):`, 'update');

            const allUpdates = data.map(item =>
                `시간: ${item.aggregatedAt}, 가격: ${item.avgPrice}원, 코드: ${item.dataCode}`
            ).join('<br>');
            addLog(allUpdates, 'update');
        });

        eventSource.onerror = (e) => {
            addLog('❌ SSE 연결 오류 발생', 'error');
            updateStatus(false);
            if (eventSource.readyState === EventSource.CLOSED) {
                addLog('🔌 연결이 서버에 의해 닫혔습니다', 'error');
            } else if (eventSource.readyState === EventSource.CONNECTING) {
                addLog('🔄 재연결 시도 중...', 'info');
            }
        };
    }

    function disconnect() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            updateStatus(false);
            addLog('🔌 연결을 끊었습니다', 'info');
        }
    }

    function clearLog() {
        log.innerHTML = '<p>로그가 지워졌습니다.</p>';
    }

    // 페이지 종료 시 연결 정리
    window.addEventListener('beforeunload', () => {
        if (eventSource) {
            eventSource.close();
        }
    });
</script>
</body>
</html>
