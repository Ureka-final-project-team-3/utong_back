<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>데이터 거래 내역 조회 테스트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-row {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: bold;
            min-width: 120px;
            color: #34495e;
        }

        input, select {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        #token {
            width: 500px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 10px;
            text-align: left;
            font-weight: bold;
            font-size: 14px;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-complete {
            background-color: #d4edda;
            color: #155724;
        }

        .price {
            font-weight: bold;
            color: #e74c3c;
        }

        .total-pay {
            font-weight: bold;
            color: #27ae60;
            font-size: 16px;
        }

        .date {
            color: #6c757d;
            font-size: 13px;
        }

        .phone {
            font-family: monospace;
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .expandable-row {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .expandable-row:hover {
            background-color: #e3f2fd !important;
        }

        .contract-toggle {
            color: #667eea;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .contract-toggle:hover {
            color: #5a67d8;
        }

        .expand-icon {
            transition: transform 0.2s;
            font-size: 12px;
        }

        .expand-icon.expanded {
            transform: rotate(90deg);
        }

        .contract-details {
            display: none;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
        }

        .contract-details td {
            padding: 8px 15px;
            font-size: 13px;
            border-bottom: 1px solid #e9ecef;
        }

        .contract-item {
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .contract-item:last-child {
            border-bottom: none;
        }

        .contract-meta {
            color: #6c757d;
            font-size: 12px;
        }

        .status-partial {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-waiting {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }

        .quantity-complete {
            color: #155724;
            font-weight: bold;
        }

        .quantity-partial {
            color: #856404;
            font-weight: bold;
        }

        .quantity-waiting {
            color: #0c5460;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 40px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .page-btn:hover:not(.active) {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🧾 데이터 거래 내역 조회 시스템</h2>

    <div class="form-row">
        <label for="token">🔐 JWT 토큰:</label>
        <input type="text" id="token" placeholder="토큰만 입력 (Bearer 안 붙여도 됩니다)" />
    </div>

    <div class="form-row">
        <label for="endpoint">📌 요청 종류:</label>
        <select id="endpoint">
            <option value="sale">판매 내역 조회</option>
            <option value="purchase">구매 내역 조회</option>
        </select>
    </div>

    <div class="form-row">
        <label for="fromDate">🗓️ 조회 시작일:</label>
        <input type="date" id="fromDate" />
    </div>

    <div class="form-row">
        <label for="toDate">🗓️ 조회 종료일:</label>
        <input type="date" id="toDate" />
    </div>

    <div class="form-row">
        <button onclick="fetchHistory()">📤 요청 보내기</button>
    </div>
</div>

<div class="container" id="resultsContainer" style="display: none;">
    <h3>📊 거래 내역 통계</h3>
    <div class="stats" id="stats"></div>

    <h3>📋 상세 거래 내역</h3>
    <div class="table-container">
        <table id="historyTable">
            <thead>
            <tr>
                <th>거래일시</th>
                <th>상태</th>
                <th>데이터 타입</th>
                <th>수량 (요청/체결)</th>
                <th>GB당 가격</th>
                <th>총 결제금액</th>
                <th>전화번호</th>
                <th>계약 상세</th>
            </tr>
            </thead>
            <tbody id="historyBody">
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    let currentData = [];
    let currentPage = 1;
    const itemsPerPage = 20;

    async function fetchHistory() {
        const token = document.getElementById("token").value.trim();
        const endpoint = document.getElementById("endpoint").value;
        const fromDate = document.getElementById("fromDate").value;
        const toDate = document.getElementById("toDate").value;

        if (!token) {
            alert("JWT 토큰을 입력해주세요.");
            return;
        }

        const url = new URL(`http://localhost:8080/api/data/${endpoint}`);
        if (fromDate) url.searchParams.append("fromDate", fromDate);
        if (toDate) url.searchParams.append("toDate", toDate);

        document.getElementById("resultsContainer").style.display = "block";
        document.getElementById("historyBody").innerHTML = '<tr><td colspan="8" class="loading">데이터를 불러오는 중...</td></tr>';

        try {
            const res = await fetch(url, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                }
            });

            const data = await res.json();

            if (data.resultCode === 200) {
                currentData = data.data;
                displayStats(currentData);
                displayHistory(currentData);
                setupPagination(currentData);
            } else {
                document.getElementById("historyBody").innerHTML = `<tr><td colspan="8" class="error">오류: ${data.message}</td></tr>`;
            }
        } catch (err) {
            document.getElementById("historyBody").innerHTML = `<tr><td colspan="8" class="error">❌ 요청 실패: ${err.message}</td></tr>`;
        }
    }

    function displayStats(data) {
        const totalTransactions = data.length;
        const totalAmount = data.reduce((sum, item) => sum + item.totalPay, 0);
        const totalQuantity = data.reduce((sum, item) => sum + item.quantity, 0);
        const avgPrice = totalQuantity > 0 ? Math.round(totalAmount / totalQuantity) : 0;

        const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${totalTransactions.toLocaleString()}</div>
                    <div class="stat-label">총 거래 건수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalAmount.toLocaleString()}원</div>
                    <div class="stat-label">총 거래 금액</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalQuantity.toLocaleString()}GB</div>
                    <div class="stat-label">총 거래 용량</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${avgPrice.toLocaleString()}원</div>
                    <div class="stat-label">평균 GB당 가격</div>
                </div>
            `;
        document.getElementById("stats").innerHTML = statsHtml;
    }

    function displayHistory(data) {
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = data.slice(startIndex, endIndex);

        const tbody = document.getElementById("historyBody");
        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="loading">조회된 거래 내역이 없습니다.</td></tr>';
            return;
        }

        tbody.innerHTML = pageData.map((item, index) => {
            const tradeDate = new Date(item.tradeDate);
            const status = getStatusText(item.status);
            const statusClass = getStatusClass(item.status);
            const dataType = getDataTypeText(item.dataCode);
            const rowId = `row-${(currentPage - 1) * itemsPerPage + index}`;

            // 요청 수량과 체결 수량 계산
            const requestedQuantity = item.quantity;
            const contractedQuantity = item.contractDto.reduce((sum, contract) => sum + contract.contractQuantity, 0);
            const remainingQuantity = item.remaining;

            // 수량 표시 형식 결정
            let quantityDisplay = '';
            let quantityClass = '';

            if (contractedQuantity === requestedQuantity) {
                // 완전 체결
                quantityDisplay = `${requestedQuantity}GB (완료)`;
                quantityClass = 'quantity-complete';
            } else if (contractedQuantity > 0) {
                // 부분 체결
                quantityDisplay = `${contractedQuantity}/${requestedQuantity}GB`;
                quantityClass = 'quantity-partial';
            } else {
                // 미체결
                quantityDisplay = `0/${requestedQuantity}GB (대기)`;
                quantityClass = 'quantity-waiting';
            }

            const contractCount = item.contractDto.length;
            const contractSummary = contractCount > 0 ? `${contractCount}건의 체결 내역` : '체결 내역 없음';

            let mainRow = `
                    <tr class="expandable-row" onclick="toggleContract('${rowId}')">
                        <td class="date">${tradeDate.toLocaleString()}</td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                        <td>${dataType}</td>
                        <td style="text-align: center">
                            <span class="${quantityClass}">${quantityDisplay}</span>
                            ${remainingQuantity > 0 ? `<br><small style="color: #6c757d;">잔여: ${remainingQuantity}GB</small>` : ''}
                        </td>
                        <td class="price">${item.pricePerGb.toLocaleString()}원</td>
                        <td class="total-pay">${item.totalPay.toLocaleString()}원</td>
                        <td><span class="phone">${item.phoneNumber}</span></td>
                        <td>
                            <span class="contract-toggle">
                                <span class="expand-icon" id="icon-${rowId}">▶</span>
                                ${contractSummary}
                            </span>
                        </td>
                    </tr>
                `;

            let contractDetails = '';
            if (item.contractDto.length > 0) {
                contractDetails = item.contractDto.map((contract, contractIndex) => {
                    const contractDate = new Date(contract.contractDate);
                    const timeDiff = Math.abs(contractDate - tradeDate);
                    const hoursDiff = Math.floor(timeDiff / (1000 * 60 * 60));
                    const minutesDiff = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));

                    let timingInfo = '';
                    if (hoursDiff > 0) {
                        timingInfo = `(${hoursDiff}시간 ${minutesDiff}분 후 체결)`;
                    } else if (minutesDiff > 0) {
                        timingInfo = `(${minutesDiff}분 후 체결)`;
                    } else {
                        timingInfo = '(즉시 체결)';
                    }

                    return `
                            <div class="contract-item">
                                <strong>체결 #${contractIndex + 1}</strong>
                                <div>📅 체결일시: ${contractDate.toLocaleString()}</div>
                                <div>📊 수량: ${contract.contractQuantity}GB</div>
                                <div>💰 단가: ${contract.pricePerUnit.toLocaleString()}원/GB</div>
                                <div>💵 금액: ${(contract.contractQuantity * contract.pricePerUnit).toLocaleString()}원</div>
                                <div class="contract-meta">⏱️ ${timingInfo}</div>
                            </div>
                        `;
                }).join('');
            } else {
                contractDetails = `
                        <div class="contract-item">
                            <div style="text-align: center; color: #6c757d; padding: 20px;">
                                📭 아직 체결된 내역이 없습니다.
                                ${remainingQuantity > 0 ? `<br>잔여 ${remainingQuantity}GB 대기 중` : ''}
                            </div>
                        </div>
                    `;
            }

            // 요약 정보 추가
            const summaryInfo = `
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                        <h5 style="margin: 0 0 10px 0; color: #495057;">📊 거래 요약</h5>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; font-size: 14px;">
                            <div><strong>요청 수량:</strong> ${requestedQuantity}GB</div>
                            <div><strong>체결 수량:</strong> ${contractedQuantity}GB</div>
                            <div><strong>잔여 수량:</strong> ${remainingQuantity}GB</div>
                            <div><strong>체결률:</strong> ${requestedQuantity > 0 ? Math.round((contractedQuantity / requestedQuantity) * 100) : 0}%</div>
                        </div>
                    </div>
                `;

            const detailRow = `
                    <tr class="contract-details" id="details-${rowId}">
                        <td colspan="8">
                            <div style="padding: 10px 0;">
                                ${summaryInfo}
                                <h4 style="margin: 0 0 15px 0; color: #495057;">📋 상세 체결 내역</h4>
                                ${contractDetails}
                            </div>
                        </td>
                    </tr>
                `;

            return mainRow + detailRow;
        }).join('');
    }

    function setupPagination(data) {
        const totalPages = Math.ceil(data.length / itemsPerPage);
        if (totalPages <= 1) {
            document.getElementById("pagination").innerHTML = '';
            return;
        }

        let paginationHtml = '';

        // 이전 페이지
        if (currentPage > 1) {
            paginationHtml += `<button class="page-btn" onclick="changePage(${currentPage - 1})">‹ 이전</button>`;
        }

        // 페이지 번호들
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);

        if (startPage > 1) {
            paginationHtml += `<button class="page-btn" onclick="changePage(1)">1</button>`;
            if (startPage > 2) {
                paginationHtml += `<span>...</span>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            paginationHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                paginationHtml += `<span>...</span>`;
            }
            paginationHtml += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
        }

        // 다음 페이지
        if (currentPage < totalPages) {
            paginationHtml += `<button class="page-btn" onclick="changePage(${currentPage + 1})">다음 ›</button>`;
        }

        document.getElementById("pagination").innerHTML = paginationHtml;
    }

    function changePage(page) {
        currentPage = page;
        displayHistory(currentData);
        setupPagination(currentData);
    }

    function toggleContract(rowId) {
        const detailsRow = document.getElementById(`details-${rowId}`);
        const icon = document.getElementById(`icon-${rowId}`);

        if (detailsRow.style.display === 'none' || detailsRow.style.display === '') {
            detailsRow.style.display = 'table-row';
            icon.textContent = '▼';
            icon.classList.add('expanded');
        } else {
            detailsRow.style.display = 'none';
            icon.textContent = '▶';
            icon.classList.remove('expanded');
        }
    }

    function getStatusText(status) {
        const statusMap = {
            '001': '완료',
            '002': '부분판매',
            '003': '대기중',
            '004': '취소'
        };
        return statusMap[status] || status;
    }

    function getStatusClass(status) {
        const statusClassMap = {
            '001': 'status-complete',
            '002': 'status-partial',
            '003': 'status-waiting',
            '004': 'status-cancelled'
        };
        return statusClassMap[status] || 'status-complete';
    }

    function getDataTypeText(dataCode) {
        const dataTypeMap = {
            '001': 'LTE',
            '002': '5G'
        };
        return dataTypeMap[dataCode] || dataCode;
    }

    // 페이지 로드시 오늘 날짜를 기본값으로 설정
    window.onload = function() {
        const today = new Date();
        const lastWeek = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

        document.getElementById("fromDate").value = lastWeek.toISOString().split('T')[0];
        document.getElementById("toDate").value = today.toISOString().split('T')[0];
    };
</script>
</body>
</html>
