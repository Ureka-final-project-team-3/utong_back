<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .loading {
            text-align: center;
            color: #666;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #007bff;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px; color: #333;">비밀번호 재설정</h1>
        
        <!-- Step 1: 토큰 입력 단계 -->
        <div id="step1" class="step active">
            <div class="form-group">
                <label for="resetToken">재설정 토큰:</label>
                <input type="text" id="resetToken" placeholder="이메일로 받은 토큰을 입력하세요" required>
                <div class="password-requirements">이메일에서 받은 토큰을 입력해주세요</div>
            </div>
            <button onclick="validateToken()" id="validateBtn">토큰 확인</button>
        </div>
        
        <!-- Step 2: 비밀번호 재설정 단계 -->
        <div id="step2" class="step">
            <div id="emailInfo" style="margin-bottom: 20px; padding: 10px; background-color: #e9ecef; border-radius: 5px;">
                <small><strong>계정:</strong> <span id="userEmail"></span></small>
            </div>
            
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">새 비밀번호:</label>
                    <input type="password" id="newPassword" required minlength="8">
                    <div class="password-requirements">최소 8자 이상 입력해주세요</div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">비밀번호 확인:</label>
                    <input type="password" id="confirmPassword" required minlength="8">
                </div>
                
                <button type="submit" id="submitBtn">비밀번호 변경</button>
            </form>
        </div>
        
        <!-- 메시지 표시 영역 -->
        <div id="messageArea"></div>
        
        <div class="back-link">
            <a href="/">로그인 페이지로 돌아가기</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/auth';
        let validatedToken = null;

        function showMessage(message, type = 'success') {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = `<div class="message ${type}">${message}</div>`;
        }

        function showStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }

        // URL에서 토큰을 가져와서 자동으로 1단계 실행 (기존 호환성)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (token) {
                document.getElementById('resetToken').value = token;
                validateToken();
            }
        });

        async function validateToken() {
            const token = document.getElementById('resetToken').value.trim();
            
            if (!token) {
                showMessage('토큰을 입력해주세요.', 'error');
                return;
            }
            
            const validateBtn = document.getElementById('validateBtn');
            validateBtn.disabled = true;
            validateBtn.textContent = '확인 중...';
            
            try {
                showMessage('<div class="loading"><div class="loading-spinner"></div> 토큰을 확인하는 중...</div>');
                
                // POST 방식으로 토큰 검증 (보안 강화)
                const response = await fetch(`${API_BASE}/validate-reset-token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token
                    })
                });
                
                const result = await response.json();
                
                if (result.resultCode === 200 && result.data.valid) {
                    validatedToken = token;
                    document.getElementById('userEmail').textContent = result.data.email;
                    showMessage('토큰이 확인되었습니다. 새 비밀번호를 설정해주세요.', 'success');
                    showStep(2);
                } else {
                    showMessage(result.message || '유효하지 않은 토큰입니다.', 'error');
                }
            } catch (error) {
                showMessage('토큰 검증 중 오류가 발생했습니다.', 'error');
            } finally {
                validateBtn.disabled = false;
                validateBtn.textContent = '토큰 확인';
            }
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showMessage('비밀번호와 비밀번호 확인이 일치하지 않습니다.', 'error');
                return;
            }
            
            if (newPassword.length < 8) {
                showMessage('비밀번호는 최소 8자 이상이어야 합니다.', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '변경 중...';
            
            try {
                showMessage('<div class="loading"><div class="loading-spinner"></div> 비밀번호를 변경하는 중...</div>');
                
                const response = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: validatedToken,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });
                
                const result = await response.json();
                
                if (result.resultCode === 200) {
                    showMessage('비밀번호가 성공적으로 변경되었습니다! 3초 후 로그인 페이지로 이동합니다.', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                } else {
                    showMessage(result.message || '비밀번호 변경에 실패했습니다.', 'error');
                }
            } catch (error) {
                showMessage('비밀번호 변경 중 오류가 발생했습니다.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '비밀번호 변경';
            }
        });

        // 비밀번호 일치 검증
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && newPassword !== confirmPassword) {
                this.setCustomValidity('비밀번호가 일치하지 않습니다.');
            } else {
                this.setCustomValidity('');
            }
        });

        // Enter 키 처리
        document.getElementById('resetToken').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                validateToken();
            }
        });
    </script>
</body>
</html>
