<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Order Queue SSE 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .controls, .status, .log-container { margin-bottom: 20px; }
        button { margin-right: 10px; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .connect { background-color: #4CAF50; color: white; }
        .disconnect { background-color: #f44336; color: white; }
        .clear { background-color: #2196F3; color: white; }
        .log-container { height: 400px; overflow-y: scroll; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; }
        .log-entry { margin: 5px 0; padding: 5px; border-left: 4px solid #ccc; }
        .initial { border-left-color: #4CAF50; background-color: #eafbea; }
        .update { border-left-color: #2196F3; background-color: #eaf2fb; }
        .error { border-left-color: #f44336; background-color: #fdeaea; color: #d32f2f; }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h1>Order Queue SSE 테스트</h1>

    <div class="controls">
        <button class="connect" onclick="connect('001')">LTE 구독 (001)</button>
        <button class="connect" onclick="connect('002')">5G 구독 (002)</button>
        <button class="disconnect" onclick="disconnect()">연결 끊기</button>
        <button class="clear" onclick="clearLog()">로그 지우기</button>
    </div>

    <div class="status">
        연결 상태: <span id="status" class="disconnected">끊어짐</span> |
        현재 구독: <span id="current">없음</span>
    </div>

    <div class="log-container" id="log">
        <p>로그가 여기에 표시됩니다.</p>
    </div>
</div>

<script>
    let eventSource = null;
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    const current = document.getElementById('current');

    function connect(dataCode) {
        disconnect();

        const url = `http://localhost:8080/api/data/order-queue/stream/${dataCode}`;
        eventSource = new EventSource(url);

        eventSource.onopen = () => {
            updateStatus(true, dataCode);
            addLog(`✅ [${dataCode}] SSE 연결 성공`);
        };

        eventSource.addEventListener("queue-initial-data", (e) => {
            const data = JSON.parse(e.data);
            addLog(`📦 초기 데이터 수신: ${JSON.stringify(data)}`, 'initial');
        });

        const hourlyEvent = `${dataCode}queue-hourly-update`;
        eventSource.addEventListener(hourlyEvent, (e) => {
            const data = JSON.parse(e.data);
            addLog(`📈 실시간 업데이트 수신: ${JSON.stringify(data)}`, 'update');
        });

        eventSource.onerror = (e) => {
            addLog(`❌ SSE 오류 발생`, 'error');
            updateStatus(false);
        };
    }

    function disconnect() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
            updateStatus(false);
            addLog('🔌 SSE 연결 해제됨');
        }
    }

    function updateStatus(connected, code = '') {
        status.textContent = connected ? '연결됨' : '끊어짐';
        status.className = connected ? 'connected' : 'disconnected';
        current.textContent = connected ? code : '없음';
    }

    function addLog(msg, type = '') {
        const timestamp = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerHTML = `<strong>[${timestamp}]</strong> ${msg}`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function clearLog() {
        log.innerHTML = '<p>로그가 지워졌습니다.</p>';
    }

    window.addEventListener('beforeunload', disconnect);
</script>
</body>
</html>
